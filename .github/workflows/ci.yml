name: CI

# Every push to main, pull request and release runs the checks. The Docker image is only
# built once they pass: on pull requests as a build-only check, on main as :edge, and on a
# published release (tagged like v1.2.3) as :1.2.3, :1.2 and :latest, which is what Unraid
# and other installs track. Pre-releases (tagged like v1.3.0-beta.1) get their version tag and
# :beta instead of :latest, so only people who opt in see them.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

# Superseded pull request runs are cancelled; main and release runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  jobspy:
    name: JobSpy service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/jobspy
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/jobspy/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  image:
    name: Docker image
    needs: check
    runs-on: ubuntu-latest
    env:
      # Pull requests only prove the image builds; nothing is published.
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
        if: env.PUBLISH == 'true'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=raw,value=beta,enable=${{ github.event_name == 'release' && github.event.release.prerelease }}
            type=edge,branch=main
            type=ref,event=pr
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH == 'true' }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The optional JobSpy service (apps/jobspy) ships as its own image with the same tags. It is
  # only pushed when apps/jobspy changed since the previous release (or, on main, since the
  # previous push), so a Jobify-only release leaves the JobSpy container alone and Unraid only
  # flags the container that actually changed.
  jobspy-image:
    name: JobSpy Docker image
    needs: jobspy
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: changes
        name: Check whether apps/jobspy changed
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            release) base=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true) ;;
            push) base="${{ github.event.before }}" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No previous version to compare against; building."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base" HEAD -- apps/jobspy; then
            echo "apps/jobspy is unchanged since $base; the image is not rebuilt."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "apps/jobspy changed since $base; building."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
        if: env.PUBLISH == 'true' && steps.changes.outputs.changed == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.changes.outputs.changed == 'true'
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true' && steps.changes.outputs.changed == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: steps.changes.outputs.changed == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-jobspy
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=raw,value=beta,enable=${{ github.event_name == 'release' && github.event.release.prerelease }}
            type=edge,branch=main
            type=ref,event=pr
      - uses: docker/build-push-action@v6
        if: steps.changes.outputs.changed == 'true'
        with:
          context: apps/jobspy
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH == 'true' }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=jobspy
          cache-to: type=gha,mode=max,scope=jobspy
